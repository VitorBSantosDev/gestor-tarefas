<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Tarefas</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="./js/main.js"></script>
</head>
<body>
    <header>
        <div class="header-topo">
            <h1>Gestor de Tarefas</h1>
            <button id="tema" aria-label="Alterar tema">🌙</button>
        </div>

        <div class="progresso">
            <div class="progresso-info">
                <span id="legenda-progresso">Progresso</span>
                <span id="texto-progresso">0%</span>
            </div>
            <div class="barra-progresso">
            <div class="barra-progresso-preenchimento" id="preenchimento"></div>
            </div>
        </div>
    </header>
    <main>
        <div class="main-container" id="main-container">
            <form id="adicionar-tarefa" novalidate>
                <label for="titulo-tarefa" class="leitor-ecra">Título da tarefa</label>
                <input type="text" id="titulo-tarefa" placeholder="Nova tarefa" maxlength="80" autocomplete="off">
                
                <label for="prioridade-tarefa" class="leitor-ecra">Prioridade</label>
                <select id="prioridade-tarefa">
                    <option value="baixa">Baixa</option>
                    <option value="media" selected>Media</option>
                    <option value="alta">Alta</option>
                </select>

                <button type="submit" id="btn-adicionar-tarefa">+ Adicionar</button>
                <p id="erro-tarefa" class="erro-formulario" aria-live="polite"></p>
            </form>
            <form id="filtrar-tarefa">
                <input type="text" id="filtro-titulo-tarefa" placeholder="Pesquisar tarefas">
                <select id="filtro-prioridade">
                    <option value="tudo" selected>Todas as prioridades</option>
                    <option value="baixa">Baixa</option>
                    <option value="media">Media</option>
                    <option value="alta">Alta</option>
                </select>
            </form>
            <div class="container-lista-tarefas">
                <section class="coluna-tarefas">
                    <div class="header-lista-tarefas">
                        <h4>Pendente</h4>
                        <span id="tarefas-pendentes">0</span>
                    </div>
                    <ul class="lista-tarefas">
                        <li>
                            <p>Teste</p>
                            <div class="tarefa-acoes">
                                <span class="prioridade">Média</span>
                                <button class="btn-mudar-status-frente">→</button>
                                <button class="btn-remover-tarefa">Remover</button>
                            </div>
                        </li>
                    </ul>
                </section>
                <section class="coluna-tarefas">
                    <div class="header-lista-tarefas">
                        <h4>Em curso</h4>
                        <span id="tarefas-em-curso">0</span>
                    </div>
                    <ul class="lista-tarefas">
                        <li>
                            <p>Teste</p>
                            <div class="tarefa-acoes">
                                <span class="prioridade">Média</span>
                                <button class="btn-mudar-status-tras">←</button>
                                <button class="btn-mudar-status-frente">→</button>
                                <button class="btn-remover-tarefa">Remover</button>
                            </div>
                        </li>
                    </ul>
                </section>
                <section class="coluna-tarefas">
                    <div class="header-lista-tarefas">
                        <h4>Concluida</h4>
                        <span id="tarefas-concluidas">0</span>
                    </div>
                    <ul class="lista-tarefas">
                        <li>
                            <p>Teste</p>
                            <div class="tarefa-acoes">
                                <span class="prioridade">Média</span>
                                <button class="btn-mudar-status-tras">←</button>
                                <button class="btn-remover-tarefa">Remover</button>
                            </div>
                        </li>
                    </ul>
                </section>
            </div>   
        </div>

    </main>
    <footer>
        <div class="footer-left">
            <strong class="footer-nome">Vitor Santos&nbsp;&nbsp;</strong>
            <span class="footer-trademark">© 2026 • ServiceNow Trainee Portfolio</span>
        </div>
        <a href="#main-container" class="footer-topo-pagina">Início ↑</a>
    </footer>

</body>
</html>
